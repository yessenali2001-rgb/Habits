<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Планировщик поездок</title>
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap">
<script>
/* тема выставляется до отрисовки, чтобы страница не мигала */
try {
  var s = localStorage.getItem('habitTheme');
  document.documentElement.dataset.theme = s === 'light' || s === 'dark' ? s
    : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
} catch (e) {}
</script>
<style>
/* Раскладка: яркая шапка с закатом над горами → две колонки (дни слева; расходы, участники, ссылка справа).
   Цвет: у каждого дня свой градиент, у каждого типа пункта свой цвет значка, фон страницы тоже цветной. */
:root {
  --bg:#eef3fb; --bg-a:rgba(238,243,251,.9); --surface:#ffffff; --surface2:#f1f4fa; --line:#dde5f2; --line2:#c3cfe4;
  --tx:#14213d; --muted:#55627d;
  --accent:#4f46e5; --accent2:#7c3aed; --accent-ink:#ffffff; --accent-tx:#4338ca;
  --bad:#c62d3a; --ok:#17744c; --warn:#9a5400;
  --viz-1:#2a78d6; --viz-2:#eb6834; --viz-3:#1baf7a; --viz-4:#eda100;
  --k-flight:#6d3fd3; --k-arrive:#138a62; --k-transport:#138a62; --k-lodging:#2a78d6; --k-food:#d9531e;
  --k-walk:#c0357f; --k-work:#a86a00; --k-rest:#5b55b8; --k-other:#5d6b86; --k-idea:#0b7a94;
  --page:linear-gradient(180deg, #e3edff 0%, #f4ecfb 48%, #fff1e4 100%);
  --shadow:0 1px 2px rgba(20,33,61,.06), 0 16px 34px -20px rgba(60,50,140,.38);
  --f-display:"Unbounded", "Onest", ui-sans-serif, system-ui, sans-serif;
  --f-body:"Onest", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#0b1020; --bg-a:rgba(11,16,32,.88); --surface:#131b33; --surface2:#1a2442; --line:#26335a; --line2:#3a4a7c;
    --tx:#eaf0ff; --muted:#9aa8cc;
    --accent:#8b8cff; --accent2:#c084fc; --accent-ink:#0b1020; --accent-tx:#aab0ff;
    --bad:#ff8f9a; --ok:#5fd3a0; --warn:#ffc65c;
    --viz-1:#3987e5; --viz-2:#d95926; --viz-3:#199e70; --viz-4:#c98500;
    --k-flight:#b79bff; --k-arrive:#4fd9a6; --k-transport:#4fd9a6; --k-lodging:#6aa8f5; --k-food:#ff9a6b;
    --k-walk:#ff8fc4; --k-work:#ffc65c; --k-rest:#aeb0ff; --k-other:#a8b4cf; --k-idea:#5fd0ea;
    --page:radial-gradient(900px 520px at 85% -8%, rgba(139,92,246,.32), transparent 62%),
      radial-gradient(760px 520px at -8% 28%, rgba(20,184,166,.22), transparent 60%),
      radial-gradient(700px 500px at 60% 105%, rgba(244,114,94,.18), transparent 60%);
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 18px 36px -22px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"] {
  --bg:#0b1020; --bg-a:rgba(11,16,32,.88); --surface:#131b33; --surface2:#1a2442; --line:#26335a; --line2:#3a4a7c;
  --tx:#eaf0ff; --muted:#9aa8cc;
  --accent:#8b8cff; --accent2:#c084fc; --accent-ink:#0b1020; --accent-tx:#aab0ff;
  --bad:#ff8f9a; --ok:#5fd3a0; --warn:#ffc65c;
  --viz-1:#3987e5; --viz-2:#d95926; --viz-3:#199e70; --viz-4:#c98500;
  --k-flight:#b79bff; --k-arrive:#4fd9a6; --k-transport:#4fd9a6; --k-lodging:#6aa8f5; --k-food:#ff9a6b;
  --k-walk:#ff8fc4; --k-work:#ffc65c; --k-rest:#aeb0ff; --k-other:#a8b4cf; --k-idea:#5fd0ea;
  --page:radial-gradient(900px 520px at 85% -8%, rgba(139,92,246,.32), transparent 62%),
    radial-gradient(760px 520px at -8% 28%, rgba(20,184,166,.22), transparent 60%),
    radial-gradient(700px 500px at 60% 105%, rgba(244,114,94,.18), transparent 60%);
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 18px 36px -22px rgba(0,0,0,.7);
  color-scheme:dark;
}

* { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; background:var(--bg); color:var(--tx); font:15px/1.5 var(--f-body); }
body::before { content:""; position:fixed; inset:0; z-index:-1; background:var(--page); pointer-events:none; }
.wrap { max-width:1080px; margin:0 auto; padding-top:max(16px, env(safe-area-inset-top, 0px)); padding-bottom:72px;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
button { font:inherit; cursor:pointer; color:inherit; }
a { color:var(--accent-tx); }
:focus-visible { outline:2px solid var(--accent-tx); outline-offset:2px; }
.hide { display:none !important; }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.ic { display:inline-flex; }
.ic svg { width:1em; height:1em; }

/* цвета дней: градиент для шапки дня и активной плашки */
.c0 { --g1:#bf3328; --g2:#cd4127; }
.c1 { --g1:#0a6b6e; --g2:#0e7f7c; }
.c2 { --g1:#5535c8; --g2:#7a3fcf; }
.c3 { --g1:#a8530a; --g2:#b35c08; }
.c4 { --g1:#1c53c0; --g2:#2569cf; }
.c5 { --g1:#a8266c; --g2:#c63a76; }
/* цвета типов пунктов */
.k-flight { --kc:var(--k-flight); } .k-arrive { --kc:var(--k-arrive); } .k-transport { --kc:var(--k-transport); }
.k-lodging { --kc:var(--k-lodging); } .k-food { --kc:var(--k-food); } .k-walk { --kc:var(--k-walk); }
.k-work { --kc:var(--k-work); } .k-rest { --kc:var(--k-rest); } .k-other { --kc:var(--k-other); } .k-idea { --kc:var(--k-idea); }

.topbar { display:flex; align-items:center; gap:12px; margin-bottom:16px; min-height:36px; }
.topbar .back { font-size:14px; text-decoration:none; color:var(--muted); }
.topbar .back:hover { color:var(--tx); }
.topbar .spacer { margin-left:auto; }

#msg { position:fixed; left:50%; transform:translateX(-50%); bottom:max(16px, env(safe-area-inset-bottom, 0px));
  width:min(92vw, 420px); z-index:30; pointer-events:none; }
.msg { padding:11px 14px; border-radius:12px; font-size:14px; box-shadow:var(--shadow); background:var(--surface); border:1px solid var(--line2); }
.msg.err { border-color:var(--bad); color:var(--bad); }
.msg.ok { border-color:var(--accent-tx); }

.btn { display:inline-flex; align-items:center; justify-content:center; gap:7px; background:var(--surface); border:1px solid var(--line);
  color:var(--tx); padding:10px 16px; border-radius:11px; text-decoration:none; text-align:center; font-weight:500; }
.btn:hover { border-color:var(--accent-tx); }
.btn.primary { background:linear-gradient(135deg, var(--accent), var(--accent2)); border-color:transparent; color:var(--accent-ink); font-weight:600;
  box-shadow:0 8px 18px -10px var(--accent); }
.btn.primary:hover { filter:brightness(1.07); }
.btn.tiny { padding:6px 11px; font-size:13px; border-radius:9px; }
.btn.ghost { background:transparent; border-color:transparent; color:var(--muted); }
.btn.ghost:hover { color:var(--tx); background:var(--surface2); }
.btn.danger { color:var(--bad); }
.btn:disabled { opacity:.55; cursor:default; }
.inp { width:100%; background:var(--surface2); border:1px solid var(--line); color:var(--tx); padding:11px 13px; border-radius:11px; font:inherit; }
.inp.sm { padding:8px 11px; }
.inp::placeholder { color:var(--muted); opacity:.75; }
textarea.inp { resize:vertical; }
.field { display:block; margin-bottom:10px; }
.field > span { display:block; font-size:13px; color:var(--muted); margin-bottom:5px; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.row .inp { flex:1; min-width:130px; width:auto; }
.muted { color:var(--muted); font-size:13px; margin:10px 0 0; }
.lead { color:var(--muted); }

.panel { background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:18px; box-shadow:var(--shadow); }
.panel h2 { margin:0 0 12px; font-size:15px; font-weight:600; display:flex; align-items:center; gap:9px; }
.panel h2::before { content:""; flex:none; width:10px; height:10px; border-radius:3px; background:linear-gradient(135deg, var(--accent), #e0507a); }
.sep { border:0; border-top:1px solid var(--line); margin:18px 0; }

/* ---------- шапка поездки: закат над горами ---------- */
.hero { position:relative; overflow:hidden; color:#fff; border-radius:26px; padding:30px 28px 38px; margin-bottom:22px;
  background:linear-gradient(135deg, #27358f 0%, #6b3aa6 38%, #d84a78 74%, #f2705a 100%);
  box-shadow:0 22px 44px -22px rgba(80,40,150,.7); }
.hero::before { content:""; position:absolute; right:11%; bottom:64px; width:104px; height:104px; border-radius:50%; pointer-events:none;
  background:radial-gradient(circle, #fff3c4 0%, #ffd479 46%, rgba(255,196,102,0) 72%); }
.hero > * { position:relative; }
.hero > .ridge { position:absolute; left:0; right:0; bottom:0; height:46%; max-height:150px; pointer-events:none; }
.hero > .ridge svg { width:100%; height:100%; display:block; }
.eyebrow { font-size:12px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); font-weight:600; }
.hero .eyebrow { color:#fff; }
.hero h1 { margin:8px 0 6px; font-family:var(--f-display); font-weight:600; font-size:clamp(26px, 5.4vw, 42px);
  line-height:1.1; letter-spacing:-.02em; text-wrap:balance; overflow-wrap:anywhere; text-shadow:0 2px 16px rgba(20,10,60,.4); }
.hero .where { margin:0 0 4px; color:#fff; }
.when { display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; margin:6px 0 0; font-size:16px; font-weight:500; }
.cd { font-size:13px; font-weight:600; padding:3px 11px; border-radius:99px; background:rgba(15,10,50,.4); color:#fff; }
.route { display:flex; align-items:center; margin-top:22px; overflow-x:auto; padding-bottom:4px; max-width:100%; }
.stop { display:flex; flex-direction:column; gap:1px; flex:none; padding:8px 14px 8px 12px; border-radius:14px; background:rgba(15,10,50,.4); }
.stop .dot { width:11px; height:11px; border-radius:50%; background:#ffd479; margin-bottom:5px; box-shadow:0 0 0 3px rgba(255,212,121,.35); }
.stop b { font-weight:600; }
.stop small { font-size:12px; }
.stop .sd { font-weight:600; margin-top:2px; }
.stop .sd:empty { display:none; }
.rlink { flex:1 1 36px; min-width:14px; border-top:2px dashed rgba(255,255,255,.75); margin:0 8px; }
.stats { display:flex; flex-wrap:wrap; gap:10px 32px; margin-top:24px; }
.stat b { display:block; font-family:var(--f-display); font-weight:600; font-size:20px; letter-spacing:-.01em; font-variant-numeric:tabular-nums; }
.stat span { font-size:12.5px; }
.who { display:flex; align-items:center; gap:10px; margin-top:18px; flex-wrap:wrap; }
.avs { display:flex; }
.av { width:30px; height:30px; border-radius:50%; display:grid; place-items:center; font-size:12px; font-weight:700;
  border:2px solid rgba(255,255,255,.7); margin-left:-8px; background:rgba(15,10,50,.5); color:#fff; }
.av:first-child { margin-left:0; }
.who small { font-size:13px; }
.hero .editdates { margin:14px 0 0; background:rgba(15,10,50,.4); color:#fff; border:1px solid rgba(255,255,255,.3); }
.hero .editdates:hover { background:rgba(15,10,50,.6); color:#fff; }

/* ---------- раскладка ---------- */
.layout { display:grid; gap:18px; grid-template-columns:minmax(0, 1fr); grid-template-areas:"budget" "main" "rest"; }
.l-budget { grid-area:budget; }
.l-main { grid-area:main; min-width:0; }
.l-rest { grid-area:rest; display:flex; flex-direction:column; gap:18px; min-width:0; }
@media (min-width:900px) {
  .layout { grid-template-columns:minmax(0, 1fr) 340px; grid-template-areas:"main budget" "main rest"; grid-template-rows:auto 1fr; gap:22px; }
}

/* ---------- расходы ---------- */
.total { font-family:var(--f-display); font-weight:600; font-size:32px; letter-spacing:-.02em; line-height:1.1; font-variant-numeric:tabular-nums; color:var(--tx); }
@supports (-webkit-background-clip:text) or (background-clip:text) {
  .total { background:linear-gradient(90deg, var(--viz-1), var(--accent2) 55%, #e0507a); -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; color:transparent; }
}
.total small { font-size:16px; font-weight:500; -webkit-text-fill-color:var(--muted); color:var(--muted); margin-left:4px; }
.bar { display:flex; gap:2px; height:14px; margin:16px 0 12px; }
.bar i { display:block; min-width:4px; border-radius:4px; }
.legend { list-style:none; margin:0; padding:0; }
.legend li { display:grid; grid-template-columns:12px minmax(0, 1fr) auto 42px; gap:10px; align-items:center; padding:7px 0; font-size:14px;
  border-top:1px solid var(--line); font-variant-numeric:tabular-nums; }
.legend li:first-child { border-top:0; }
.legend .nm { display:flex; align-items:center; gap:7px; min-width:0; }
.legend .nm .ic { color:var(--muted); }
.legend .pc { color:var(--muted); text-align:right; }
.sw { width:12px; height:12px; border-radius:3px; display:block; }
.v1 { background:var(--viz-1); } .v2 { background:var(--viz-2); } .v3 { background:var(--viz-3); } .v4 { background:var(--viz-4); }

/* ---------- полоса дней ---------- */
.strip { position:sticky; top:env(safe-area-inset-top, 0px); z-index:5; -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  padding:8px 0 10px; margin-bottom:6px; }
.strip-in { position:relative; display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; padding:2px 2px 4px; }
.strip-in::-webkit-scrollbar { display:none; }
.dchip { position:relative; flex:none; min-width:100px; display:grid; gap:1px; text-align:left; padding:8px 12px 12px; border-radius:14px;
  border:1px solid var(--line); background:var(--surface); overflow:hidden; }
.dchip .dn { display:flex; align-items:center; gap:6px; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:600; }
.dchip .dn .dot { width:8px; height:8px; border-radius:50%; background:linear-gradient(135deg, var(--g1), var(--g2)); }
.dchip b { font-size:14px; font-weight:600; }
.dchip .da { font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums; }
.dchip .dbar { position:absolute; left:0; bottom:0; height:3px; background:linear-gradient(90deg, var(--g1), var(--g2)); border-radius:0 3px 0 0; }
.dchip.on { background:linear-gradient(120deg, var(--g1), var(--g2)); border-color:transparent; color:#fff; box-shadow:0 10px 20px -12px var(--g1); }
.dchip.on .dn, .dchip.on .da { color:#fff; }
.dchip.on .dn .dot { background:#fff; }
.dchip.on .dbar { background:rgba(255,255,255,.75); }
.dchip.today .dn::after { content:"· сегодня"; }

/* ---------- день ---------- */
.day { background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:0 18px 12px; margin-bottom:18px; overflow:hidden;
  box-shadow:var(--shadow); scroll-margin-top:92px; }
.dh { display:grid; grid-template-columns:auto minmax(0, 1fr) auto; gap:14px; align-items:center; margin:0 -18px 10px; padding:16px 18px;
  background:linear-gradient(120deg, var(--g1), var(--g2)); color:#fff; }
.dtile { width:56px; height:60px; border-radius:16px; background:rgba(255,255,255,.2); border:1px solid rgba(255,255,255,.4); display:grid; place-content:center;
  text-align:center; line-height:1; }
.dtile b { font-family:var(--f-display); font-size:23px; font-weight:600; }
.dtile span { font-size:11px; letter-spacing:.08em; text-transform:uppercase; font-weight:700; margin-top:5px; }
.dtitle { min-width:0; }
.dtitle h3 { margin:0; font-size:17px; font-weight:600; overflow-wrap:anywhere; }
.dsub { font-size:13px; font-weight:500; }
.dsub.warn { display:inline-block; background:rgba(0,0,0,.28); padding:0 9px; border-radius:99px; }
.dsum { font-weight:600; font-size:14px; padding:5px 12px; border-radius:99px; background:rgba(0,0,0,.26); color:#fff; white-space:nowrap;
  font-variant-numeric:tabular-nums; }
.dlabel { width:100%; font:inherit; font-size:17px; font-weight:600; background:transparent; color:#fff; border:0; border-bottom:1px dashed rgba(255,255,255,.65);
  padding:0 0 2px; border-radius:0; }
.dlabel::placeholder { font-weight:400; color:#fff; opacity:.8; }
.dlabel:focus-visible { outline-color:#fff; outline-offset:3px; }
.free { color:var(--muted); font-size:14px; margin:6px 0 10px; }
.it.leg { padding:0 0 3px; }
.leg .ldot { width:10px; height:10px; border-radius:50%; background:var(--surface); border:2px solid var(--g2); align-self:start; justify-self:center; margin-top:8px;
  position:relative; z-index:1; box-shadow:0 0 0 4px var(--surface); }
.leg .lbody { grid-column:3 / -1; min-width:0; padding:2px 0; }
.legpill { display:inline-flex; align-items:center; gap:6px; margin-right:6px; font-size:12.5px; font-weight:600; padding:3px 10px; border-radius:99px; background:var(--surface2);
  font-variant-numeric:tabular-nums; }
.legpill.busy { color:var(--muted); font-weight:500; }
.legpill.warn { background:transparent; border:1px solid var(--warn); color:var(--warn); }
.legpill .ic { font-size:14px; color:var(--muted); }
.leg a, .leg .lnk { font-size:12.5px; margin-left:10px; color:var(--accent-tx); }
.leg .lnk { background:none; border:0; padding:0; text-decoration:underline; }
.legname { display:block; font-size:11.5px; color:var(--muted); margin-top:2px; overflow-wrap:anywhere; }
.dres { margin-top:12px; }
.dr b { display:block; margin-bottom:2px; overflow-wrap:anywhere; }

.tl { list-style:none; margin:0; padding:0; }
.it { --tc:60px; --bc:36px; --gp:10px; position:relative; display:grid; grid-template-columns:var(--tc) var(--bc) minmax(0, 1fr) auto 28px;
  column-gap:var(--gp); padding:9px 0; }
.it::before { content:""; position:absolute; left:calc(var(--tc) + var(--gp) + var(--bc) / 2 - 1px); top:0; bottom:0; width:2px;
  background:linear-gradient(var(--g1), var(--g2)); opacity:.4; }
.it:first-child::before { top:calc(9px + var(--bc) / 2); }
.it:last-child::before { bottom:calc(100% - 9px - var(--bc) / 2); }
.tm { text-align:right; padding-top:7px; font-variant-numeric:tabular-nums; font-weight:600; font-size:14px; line-height:1.2; }
.tm small { display:block; font-weight:400; color:var(--muted); font-size:12px; margin-top:2px; }
.tm.none { font-weight:400; color:var(--muted); }
.bd { width:var(--bc); height:var(--bc); border-radius:50%; display:grid; place-items:center; background:var(--surface); color:var(--kc, var(--k-other));
  position:relative; z-index:1; box-shadow:0 0 0 4px var(--surface); font-size:18px; }
.bd::before { content:""; position:absolute; inset:0; border-radius:50%; background:currentColor; opacity:.16; }
.bd .ic { position:relative; }
.it.nested .bd { width:28px; height:28px; margin:4px; font-size:15px; }
.ib { min-width:0; padding-top:6px; }
.ititle { font-weight:600; overflow-wrap:anywhere; }
.it.nested .ititle { font-weight:500; }
.iplace { font-size:13.5px; overflow-wrap:anywhere; }
.iplace a { color:var(--muted); text-decoration:none; }
.iplace a:hover { color:var(--accent-tx); text-decoration:underline; }
.iplace a.dg { display:inline-block; margin-left:2px; padding:0 9px; border:1px solid var(--accent-tx); border-radius:99px; color:var(--accent-tx); font-size:12px; font-weight:600; text-decoration:none; }
.iplace a.dg:hover { background:var(--surface2); text-decoration:none; }
.tag { display:inline-block; margin:5px 6px 0 0; font-size:12.5px; background:var(--surface2); color:var(--muted); border-radius:8px; padding:2px 9px; overflow-wrap:anywhere; }
.conf { display:inline-flex; align-items:center; gap:8px; margin-top:6px; font-size:13px; font-weight:600; color:var(--warn); cursor:pointer; }
.conf.yes { color:var(--ok); }
.conf input { width:18px; height:18px; margin:0; accent-color:var(--ok); }
.conf input:disabled { cursor:default; }

<script>
'use strict';
/* ================= константы и утилиты ================= */
const STORE = 'tripPlans.v1';
const MAX_DAYS = 60, MAX_PEOPLE = 30, MAX_ITEMS = 400, MAX_INFLATED = 400000, MAX_COST = 1e9;
const CURRENCIES = ['₸', 'сом', '₽', '$', '€', ''];
const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const timeRe = /^([01]\d|2[0-3]):[0-5]\d$/;
const isoRe = /^\d{4}-\d{2}-\d{2}$/;
const goodId = x => typeof x === 'string' && /^[\w-]{1,40}$/.test(x);
const own = (o, k) => typeof k === 'string' && Object.prototype.hasOwnProperty.call(o, k);

const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const plural = (n, a, b, c) => { const m = n % 100, k = n % 10; return m > 10 && m < 20 ? c : k === 1 ? a : k > 1 && k < 5 ? b : c; };
const reduced = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

/* Все данные (в том числе из чужих ссылок) попадают на страницу только через
   textContent / setAttribute, поэтому HTML из них никогда не разбирается.
   Значки — постоянные строки внутри этого файла, не данные. */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  let value;
  for (const k in (attrs || {})) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'value') value = v;
    else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  append(el, kids);
  if (value !== undefined) el.value = value;
  return el;
}
function append(el, kids) {
  for (const k of kids) {
    if (k == null || k === false) continue;
    if (Array.isArray(k)) append(el, k);
    else el.append(k.nodeType ? k : document.createTextNode(String(k)));

}
function raw(html) { const d = document.createElement('div'); d.innerHTML = html; return d.firstElementChild; }

/* replaceChildren сам не раскладывает массивы и превращает false в текст «false» */
function show(...kids) {

  view.replaceChildren();
  append(view, kids);
}

let toastTimer;
function toast(text, bad) {
  $('#msg').replaceChildren(h('div', { class: 'msg ' + (bad ? 'err' : 'ok') }, text));
  clearTimeout(toastTimer);

}

/* ================= значки и типы пунктов ================= */
const ICONS = {
  plane: '<path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/>',
  pin: '<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
  car: '<path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/>',
  bus: '<path d="M8 6v6M15 6v6M2 12h19.6M18 18h3s.5-1.7.8-2.8c.1-.4.2-.8.2-1.2 0-.4-.1-.8-.2-1.2l-1.4-5C20.1 6.8 19.1 6 18 6H4a2 2 0 0 0-2 2v10h3"/><circle cx="7" cy="18" r="2"/><path d="M9 18h5"/><circle cx="16" cy="18" r="2"/>',
  bed: '<path d="M2 20v-8a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v8M4 10V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v4M12 4v6M2 18h20"/>',
  food: '<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>',
  compass: '<circle cx="12" cy="12" r="10"/><path d="m16.24 7.76-2.12 6.36-6.36 2.12 2.12-6.36 6.36-2.12z"/>',
  cap: '<path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>',
  moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
  foot: '<path d="M4 16v-2.38C4 11.5 2.97 10.5 3 8c.03-2.72 1.49-6 4.5-6C9.37 2 10 3.8 10 5.5c0 3.11-2 5.66-2 8.68V16a2 2 0 1 1-4 0Z"/><path d="M20 20v-2.38c0-2.12 1.03-3.12 1-5.62-.03-2.72-1.49-6-4.5-6C14.63 6 14 7.8 14 9.5c0 3.11 2 5.66 2 8.68V20a2 2 0 1 0 4 0Z"/><path d="M16 17h4M4 13h4"/>',
  bulb: '<path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6M10 22h4"/>',
  dot: '<circle cx="12" cy="12" r="3"/>'
};
function ico(name) {
  const s = raw('<span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
    (own(ICONS, name) ? ICONS[name] : ICONS.dot) + '</svg></span>');

}
const RIDGE = '<span class="ridge" aria-hidden="true"><svg viewBox="0 0 600 140" preserveAspectRatio="none">' +
  '<path fill="rgba(255,255,255,.16)" d="M0 140V70l50-34 40 20 60-46 70 56 50-30 80 52 60-36 70 48 50-28 70 44V140z"/>' +
  '<path fill="rgba(18,12,60,.32)" d="M0 140V96l60-40 46 28 64-52 56 46 70-34 70 58 66-40 64 44 56-26 48 40V140z"/>' +
  '<path fill="rgba(18,12,60,.55)" d="M0 140V118l70-34 60 26 80-48 70 46 90-36 80 52 70-30 80 36V140z"/></svg></span>';

const KINDS = {
  flight: { label: 'Перелёт', icon: 'plane' },
  arrive: { label: 'Прибытие', icon: 'pin' },
  transport: { label: 'Транспорт', icon: 'car' },
  lodging: { label: 'Жильё', icon: 'bed' },
  food: { label: 'Еда', icon: 'food' },
  walk: { label: 'Прогулка', icon: 'compass' },
  work: { label: 'Дела', icon: 'cap' },
  rest: { label: 'Отдых', icon: 'moon' },
  idea: { label: 'Идея', icon: 'bulb' },
  other: { label: 'Другое', icon: 'dot' }
};
const GUESS = [
  ['flight', /самол[её]т|аэропорт|рейс|вылет|прил[её]т|авиа/i],
  ['lodging', /гостиниц|отел|хостел|hostel|квартир|апарт|ночлег|заселен|орналас/i],
  ['food', /завтрак|обед|ужин|кафе|ресторан|хавчик|кофе|ланч|перекус|тамақ/i],
  ['transport', /такси|автовокзал|автобус|вокзал|поезд|метро|трансфер|маршрутк|электричк/i],
  ['walk', /қыдыр|гуля|прогулк|экскурс|музей|парк|набережн/i],
  ['work', /school|школ|встреч|работ|конференц|лекци|урок|universit|университет|институт|колледж|academy|академи/i],
  ['rest', /отбой|отдых|спать/i]
];
const kindOf = it => own(KINDS, it.kind) ? it.kind : ((GUESS.find(g => g[1].test(it.title)) || [])[0] || 'other');
const iconOf = (it, kind) => kind === 'transport' && /автовокзал|автобус|маршрутк|bus/i.test(it.title) ? 'bus' : KINDS[kind].icon;

/* категории расходов: цвет закреплён за категорией, а не за её местом в списке */
const BCATS = [
  { id: 'lodging', label: 'Жильё', icon: 'bed' },
  { id: 'food', label: 'Еда', icon: 'food' },
  { id: 'transport', label: 'Транспорт', icon: 'car' },
  { id: 'other', label: 'Прочее', icon: 'dot' }
];
const bcatOf = k => k === 'lodging' ? 'lodging' : k === 'food' ? 'food' : (k === 'transport' || k === 'arrive' || k === 'flight') ? 'transport' : 'other';

const nf = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 2 });
const money = (n, c) => nf.format(n) + (c ? '\u00a0' + c : '');

/* ================= даты (строки YYYY-MM-DD, без часовых поясов) ================= */
function parseISO(s) { const p = s.split('-').map(Number); return new Date(Date.UTC(p[0], p[1] - 1, p[2])); }
function toISO(d) { return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }
function validDate(s) { return typeof s === 'string' && isoRe.test(s) && toISO(parseISO(s)) === s; }
function addDays(s, n) { const d = parseISO(s); d.setUTCDate(d.getUTCDate() + n); return toISO(d); }
function diffDays(a, b) { return Math.round((parseISO(b) - parseISO(a)) / 864e5); }
function todayISO() { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
const dayFmt = new Intl.DateTimeFormat('ru-RU', { weekday: 'short', day: 'numeric', month: 'long', timeZone: 'UTC' });
const rangeFmt = new Intl.DateTimeFormat('ru-RU', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' });
const rangeShort = new Intl.DateTimeFormat('ru-RU', { day: 'numeric', month: 'long', timeZone: 'UTC' });
const wdLong = new Intl.DateTimeFormat('ru-RU', { weekday: 'long', timeZone: 'UTC' });
const wdShort = new Intl.DateTimeFormat('ru-RU', { weekday: 'short', timeZone: 'UTC' });
const monShort = new Intl.DateTimeFormat('ru-RU', { month: 'short', timeZone: 'UTC' });
const fmtDay = s => cap(dayFmt.format(parseISO(s)));
const dnum = s => parseISO(s).getUTCDate();
const dmon = s => monShort.format(parseISO(s)).replace('.', '');
function fmtRange(a, b) {
  if (a === b) return rangeFmt.format(parseISO(a));
  const A = parseISO(a), B = parseISO(b);
  if (A.getUTCFullYear() === B.getUTCFullYear()) {
    if (A.getUTCMonth() === B.getUTCMonth()) return A.getUTCDate() + '–' + rangeFmt.format(B);
    return rangeShort.format(A) + ' – ' + rangeFmt.format(B);
  }
  return rangeFmt.format(A) + ' – ' + rangeFmt.format(B);
}
const compact = s => s.replace(/-/g, '');

const mins = t => +t.slice(0, 2) * 60 + +t.slice(3);
function stamp(date, m) {                       // m может перевалить за сутки
  let d = date;
  while (m >= 1440) { m -= 1440; d = addDays(d, 1); }
  return compact(d) + 'T' + pad(Math.floor(m / 60)) + pad(m % 60) + '00';
}
function itemSpan(it) {                         // без конца — час
  const s = mins(it.time);
  const e = it.end && mins(it.end) > s ? mins(it.end) : s + 60;
  return [stamp(it.date, s), stamp(it.date, e)];
}

/* ================= модель и хранилище ================= */
const state = { trips: [] };

/* Единая проверка: и для сохранённых данных, и для чужих ссылок. */
function normTrip(o) {
  if (!o || typeof o !== 'object') return null;
  if (!validDate(o.start) || !validDate(o.end) || o.end < o.start || diffDays(o.start, o.end) >= MAX_DAYS) return null;
  const s = (x, n) => typeof x === 'string' ? x.slice(0, n) : '';
  const t = {
    id: goodId(o.id) ? o.id : uid(),
    title: s(o.title, 120).trim() || 'Поездка',
    dest: s(o.dest, 120).trim(),
    start: o.start, end: o.end,
    currency: CURRENCIES.indexOf(o.currency) >= 0 ? o.currency : '₸',
    labels: {}, people: [], items: [],
    updated: +o.updated || Date.now()
  };
  if (o.labels && typeof o.labels === 'object') {
    Object.keys(o.labels).slice(0, MAX_DAYS + 20).forEach(k => {
      const v = s(o.labels[k], 60).trim();
      if (validDate(k) && v) t.labels[k] = v;
    });
  }
  (Array.isArray(o.people) ? o.people : []).slice(0, MAX_PEOPLE).forEach(p => {
    if (!p || typeof p !== 'object') return;
    const email = typeof p.email === 'string' && emailRe.test(p.email) && p.email.length <= 120 ? p.email : '';
    const name = s(p.name, 60).trim();
    if (name || email) t.people.push({ name: name || email.split('@')[0], email });
  });
  (Array.isArray(o.items) ? o.items : []).slice(0, MAX_ITEMS).forEach(i => {
    if (!i || typeof i !== 'object' || !validDate(i.date)) return;
    const title = s(i.title, 120).trim();
    if (!title) return;
    const time = timeRe.test(i.time) ? i.time : '';
    const c = Number(i.cost);
    t.items.push({
      id: goodId(i.id) ? i.id : uid(), date: i.date, time,
      end: time && timeRe.test(i.end) ? i.end : '',
      title, place: s(i.place, 160).trim(), note: s(i.note, 600).trim(),
      cost: isFinite(c) && c > 0 && c <= MAX_COST ? Math.round(c * 100) / 100 : 0,
      kind: own(KINDS, i.kind) ? i.kind : '',
      conf: [0, 1, 2].indexOf(Number(i.conf)) >= 0 ? Number(i.conf) : 0       // 0 не нужно, 1 нужно подтвердить, 2 подтверждено
    });
  });
  return t;
}
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(STORE));
    if (d && Array.isArray(d.trips)) state.trips = d.trips.map(normTrip).filter(Boolean);
  } catch (e) {}
}
function save() {
  try { localStorage.setItem(STORE, JSON.stringify(state)); }
  catch (e) { toast('Не удалось сохранить: память браузера недоступна или переполнена', true); }
}

function tripDays(t) {
  const set = new Set();
  const n = Math.min(diffDays(t.start, t.end), MAX_DAYS - 1);
  for (let i = 0; i <= n; i++) set.add(addDays(t.start, i));
  t.items.forEach(i => set.add(i.date));       // пункты вне дат не теряются
  return [...set].sort();
}
const inRange = (t, d) => d >= t.start && d <= t.end;
/* По времени. Пункт без времени встаёт сразу после предыдущего пункта (как строки в таблице);
   если он первый в дне, то идёт в начале. */
function dayItems(t, d) {
  let last = '';
  const arr = t.items.filter(i => i.date === d).map((i, n) => {
    if (i.time) last = i.time;
    return { i, n, key: i.time || last };
  });
  arr.sort((a, b) => a.key.localeCompare(b.key) || a.n - b.n);
  return arr.map(x => x.i);
}
/* Пункт, который целиком проходит внутри другого (обед во время школы), показываем вложенным. */
function parentsOf(its) {
  const map = new Map();
  its.forEach((it, idx) => {
    if (!it.time) return;
    const s = mins(it.time), e = it.end && mins(it.end) > s ? mins(it.end) : s;
    for (let j = idx - 1; j >= 0; j--) {
      const p = its[j];
      if (!p.time || !p.end || mins(p.end) <= mins(p.time) || map.has(p)) continue;
      if (mins(p.time) <= s && s < mins(p.end) && e <= mins(p.end)) { map.set(it, p); break; }
    }
  });
  return map;
}

const icsEsc = s => String(s).replace(/\\/g, '\\\\').replace(/\r?\n/g, '\\n').replace(/,/g, '\\,').replace(/;/g, '\\;');

  const enc = new TextEncoder();
  let out = '', cur = '', bytes = 0, limit = 75;
  for (const ch of line) {
    const b = enc.encode(ch).length;
    if (bytes + b > limit) { out += cur + '\r\n '; cur = ''; bytes = 0; limit = 74; }
    cur += ch; bytes += b;

function buildICS(t) {
  const now = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Habits//Trips//RU', 'CALSCALE:GREGORIAN',
    'METHOD:PUBLISH', 'X-WR-CALNAME:' + icsEsc(t.title)];
  const ev = (key, fields) => L.push('BEGIN:VEVENT', 'UID:' + t.id + '-' + key + '@habits-trips',
    'DTSTAMP:' + now, ...fields, 'END:VEVENT');
  ev('trip', ['DTSTART;VALUE=DATE:' + compact(t.start), 'DTEND;VALUE=DATE:' + compact(addDays(t.end, 1)),
    'SUMMARY:' + icsEsc('✈ ' + t.title), t.dest && 'LOCATION:' + icsEsc(t.dest),
    'DESCRIPTION:' + icsEsc(summary(t)), 'TRANSP:TRANSPARENT'].filter(Boolean));
  t.items.forEach(it => {

      ? (s => ['DTSTART:' + s[0], 'DTEND:' + s[1]])(itemSpan(it))
      : ['DTSTART;VALUE=DATE:' + compact(it.date), 'DTEND;VALUE=DATE:' + compact(addDays(it.date, 1))];
    ev(it.id, [...when, 'SUMMARY:' + icsEsc(it.title), it.place && 'LOCATION:' + icsEsc(it.place),
      it.note && 'DESCRIPTION:' + icsEsc(it.note)].filter(Boolean));

}

function b64u(bytes) {
  let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

  while (str.length % 4) str += '=';
  const bin = atob(str), out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
async function readAll(stream, limit) {
  const reader = stream.getReader(), chunks = [];
  let n = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    n += value.length;
    if (n > limit) { reader.cancel(); throw new Error('too big'); }   // защита от «бомбы» в ссылке
    chunks.push(value);
  }
  const out = new Uint8Array(n);
  let o = 0;
  chunks.forEach(c => { out.set(c, o); o += c.length; });
  return out;
}
async function pack(obj) {
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  if (typeof CompressionStream === 'function') {
    try { return 'z' + b64u(await readAll(new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw')), 1e7)); }
    catch (e) {}
  }
  return 'j' + b64u(bytes);
}
async function unpack(str) {
  const bytes = unb64u(str.slice(1));
  if (str[0] === 'j') return JSON.parse(new TextDecoder().decode(bytes));
  if (str[0] !== 'z') throw new Error('format');
  const raw = await readAll(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw')), MAX_INFLATED);
  return JSON.parse(new TextDecoder().decode(raw));
}

/* ================= расстояния: Photon (поиск места) + OSRM (маршрут по дорогам), оба на данных OpenStreetMap ================= */
const GEO_KEY = 'tripGeo.v1', LEG_KEY = 'tripLegs.v1';
let geoCache = {}, legCache = {}, geoQueue = Promise.resolve();
const geoPending = {}, legPending = {};
function loadCache(key) { try { const o = JSON.parse(localStorage.getItem(key)); return o && typeof o === 'object' ? o : {}; } catch (e) { return {}; } }
function saveCache(key, o) {
  try {
    const ks = Object.keys(o);
    if (ks.length > 400) ks.slice(0, 200).forEach(k => { delete o[k]; });
    localStorage.setItem(key, JSON.stringify(o));
  } catch (e) {}
}
geoCache = loadCache(GEO_KEY); legCache = loadCache(LEG_KEY);

async function fetchJson(url) {
  const c = new AbortController(), tm = setTimeout(() => c.abort(), 9000);
  try {
    const r = await fetch(url, { signal: c.signal });
    if (!r.ok) throw new Error('http ' + r.status);
    return await r.json();
  } finally { clearTimeout(tm); }
}
const okPoint = (lat, lon) => isFinite(lat) && isFinite(lon) && Math.abs(lat) <= 90 && Math.abs(lon) <= 180;
const sleep = ms => new Promise(res => setTimeout(res, ms));
async function fetchJsonRetry(url, retries) {
  for (let i = 0; ; i++) {
    try { return await fetchJson(url); }
    catch (e) { if (i >= retries) throw e; await sleep(700); }
  }
}
/* Три источника: Open-Meteo находит города (самый крупный с таким названием), Photon находит места и адреса, Nominatim запасной.
   Для одного слова, например «Актобе», города идут первыми: иначе Photon может найти хутор с тем же названием. */
async function viaMeteo(q) {
  const j = await fetchJson('https://geocoding-api.open-meteo.com/v1/search?count=1&language=ru&name=' + encodeURIComponent(q));
  const f = j && j.results && j.results[0];
  if (!f) return null;
  const lat = Number(f.latitude), lon = Number(f.longitude);
  return okPoint(lat, lon) ? { lat, lon, name: [f.name, f.country].filter(Boolean).join(', ').slice(0, 90) } : null;
}
async function viaPhoton(q, near) {
  const bias = near ? '&lat=' + near.lat + '&lon=' + near.lon : '';
  const j = await fetchJsonRetry('https://photon.komoot.io/api/?limit=1' + bias + '&q=' + encodeURIComponent(q), 1);
  const f = j && j.features && j.features[0];
  if (!f) return null;
  const c = f.geometry && f.geometry.coordinates, pr = f.properties || {};
  const lon = Number(c && c[0]), lat = Number(c && c[1]);
  if (!okPoint(lat, lon)) return null;
  const name = [pr.name || [pr.street, pr.housenumber].filter(Boolean).join(' '), pr.city || pr.state].filter(Boolean).join(', ');
  const res = { lat, lon, name: (name || q).slice(0, 90) };
  if (/\d/.test(q) && !pr.housenumber && pr.osm_key === 'highway') res.approx = true;     // нашлась улица, а не дом
  return res;
}
async function viaNominatim(q) {
  const j = await fetchJson('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q=' + encodeURIComponent(q));
  const f = Array.isArray(j) ? j[0] : null;
  if (!f) return null;
  const lat = Number(f.lat), lon = Number(f.lon);
  return okPoint(lat, lon) ? { lat, lon, name: String(f.display_name || q).split(',').slice(0, 2).join(',').slice(0, 90) } : null;
}
const NEAR_KM = 120;
async function fetchGeo(q, cityFirst) {
  const oneWord = !/[\s,\d]/.test(q);
  const chain = cityFirst || oneWord ? [viaMeteo, viaPhoton, viaNominatim] : [viaPhoton, viaNominatim, viaMeteo];
  /* «Место, Город»: сначала находим город и ищем место рядом с ним; ответ дальше 120 км от города считаем чужим. */
  let near = null;
  const m = q.match(/,\s*([^,\d\s][^,\d]*)$/);
  if (!cityFirst && m && !/\s/.test(m[1].trim())) { try { near = await viaMeteo(m[1].trim()); } catch (e) { near = null; } }
  let answered = false;
  for (const via of chain) {
    try {
      let r = await via(q, near);
      if (via !== viaMeteo || cityFirst || oneWord) answered = true;     // Open-Meteo знает только города, его «не нашёл» для адреса ничего не значит
      if (r && near && haversine(near, r) > NEAR_KM * 1000) r = null;
      if (r) return r;
    } catch (e) { /* сервис недоступен, пробуем следующий */ }
  }
  if (answered) return null;                   // хоть один ответил, что такого места нет
  throw new Error('geocoders unavailable');
}
/* Запросы идут по одному с паузой — так просят вести себя бесплатные сервисы. Ответы запоминаются в браузере. */
function geocode(q, cityFirst) {
  q = q.trim();
  const key = q.toLowerCase() + (cityFirst ? '|c' : '');
  if (own(geoCache, key)) return Promise.resolve(geoCache[key]);
  if (own(geoPending, key)) return geoPending[key];
  const job = geoQueue.then(() => fetchGeo(q, cityFirst)).then(r => { geoCache[key] = r; saveCache(GEO_KEY, geoCache); return r; });
  geoPending[key] = job;
  const done = () => { delete geoPending[key]; };
  job.then(done, done);
  geoQueue = job.catch(() => {}).then(() => new Promise(res => setTimeout(res, 400)));
  return job;
}
function haversine(a, b) {
  const R = 6371000, rad = x => x * Math.PI / 180;
  const dLat = rad(b.lat - a.lat), dLon = rad(b.lon - a.lon);
  const h2 = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h2));
}
async function roadRoute(a, b) {
  const key = [a.lat, a.lon, b.lat, b.lon].map(x => x.toFixed(4)).join(',');
  if (own(legCache, key)) return legCache[key];
  try {
    const j = await fetchJson('https://router.project-osrm.org/route/v1/driving/' + a.lon + ',' + a.lat + ';' + b.lon + ',' + b.lat + '?overview=false');
    const r = j && j.code === 'Ok' && j.routes && j.routes[0];
    if (r && isFinite(r.distance) && isFinite(r.duration)) {
      legCache[key] = { m: r.distance, s: r.duration };
      saveCache(LEG_KEY, legCache);
      return legCache[key];
    }
  } catch (e) {}
  return null;                                 // не получилось: по прямой покажем, но не запоминаем
}
/* Пешком: маршрут для пешеходов (routing.openstreetmap.de). Если сервис молчит, оценка: дорога или прямая ×1,3, скорость 5 км/ч. */
async function footRoute(a, b) {
  const key = 'f:' + [a.lat, a.lon, b.lat, b.lon].map(x => x.toFixed(4)).join(',');
  if (own(legCache, key)) return legCache[key];
  try {
    const j = await fetchJson('https://routing.openstreetmap.de/routed-foot/route/v1/foot/' + a.lon + ',' + a.lat + ';' + b.lon + ',' + b.lat + '?overview=false');
    const r = j && j.code === 'Ok' && j.routes && j.routes[0];
    if (r && isFinite(r.distance) && isFinite(r.duration)) {
      legCache[key] = { m: r.distance, s: r.duration };
      saveCache(LEG_KEY, legCache);
      return legCache[key];
    }
  } catch (e) {}
  return null;
}
const walkEstimate = m => ({ m, s: m / 1.39, est: true });
/* Расстояние между двумя местами, заданными текстом. */
function legInfo(a, b, plane, cities) {
  const key = a.trim().toLowerCase() + '|' + b.trim().toLowerCase() + (plane ? '|air' : '') + (cities ? '|c' : '');
  if (own(legPending, key)) return legPending[key];
  const job = (async () => {
    const pa = await geocode(a, cities), pb = await geocode(b, cities);
    if (!pa) return { missing: a };
    if (!pb) return { missing: b };
    const line = haversine(pa, pb);
    if (plane) return { pa, pb, line, plane: true, road: false, m: line, s: 0 };     // самолёт летит почти по прямой
    const [road, foot] = await Promise.all([roadRoute(pa, pb), footRoute(pa, pb)]);
    const walk = foot || walkEstimate(road ? road.m : line * 1.3);
    return { pa, pb, line, road: !!road, m: road ? road.m : line, s: road ? road.s : 0, walk };
  })();
  legPending[key] = job;
  const done = () => { delete legPending[key]; };
  job.then(done, done);
  return job;
}

  if (m < 1000) return Math.max(10, Math.round(m / 10) * 10) + ' м';
  return nf.format(m < 10000 ? Math.round(m / 100) / 10 : Math.round(m / 1000)) + ' км';

const initials = name => name.trim().split(/\s+/).slice(0, 2).map(w => w.charAt(0).toUpperCase()).join('') || '?';
function routeStops(t) {

  tripDays(t).forEach(d => dayItems(t, d).forEach(i => {

      if (!prev || prev.name !== i.title) out.push({ name: i.title, date: d, by: last === 'flight' ? 'plane' : '' });
    }
    last = k;
  }));
  return out;
}

function watchDays() {
  if (spy) { spy.disconnect(); spy = null; }
  if (!('IntersectionObserver' in window)) return;
  spy = new IntersectionObserver(entries => entries.forEach(e => {
    if (!e.isIntersecting) return;
    document.querySelectorAll('.dchip').forEach(c => {
      const on = c.dataset.day === e.target.dataset.day;
      c.classList.toggle('on', on);
      if (on) {
        c.setAttribute('aria-current', 'true');
        const row = c.parentNode;
        row.scrollTo({ left: c.offsetLeft - (row.clientWidth - c.offsetWidth) / 2, behavior: reduced() ? 'auto' : 'smooth' });
      } else c.removeAttribute('aria-current');
    });
  }), { rootMargin: '-25% 0px -65% 0px' });
  document.querySelectorAll('.day').forEach(d => spy.observe(d));
}

}

function legRow(a, b, ca, cb) {
  const qa = withCity(a.place, ca), qb = withCity(b.place, cb);
  const body = h('div', { class: 'lbody' });
  const dir = h('a', { href: dirUrl(qa, qb), target: '_blank', rel: 'noopener' }, 'Маршрут');
  const run = () => {
    body.replaceChildren(h('span', { class: 'legpill busy' }, 'считаем расстояние…'));
    legInfo(qa, qb).then(i => {
      if (i.missing) {
        body.replaceChildren(h('span', { class: 'legpill busy' }, 'место не найдено на карте: «' + i.missing + '»'), dir);
        return;
      }
      const dg2 = dgisRoute(dgisSame(a.place, ca, b.place, cb), i.pa, i.pb);
      const far = i.line > 150000;                  // так далеко в одном дне бывает редко: скорее всего найден другой город
      body.replaceChildren();                       // append, а не replaceChildren с аргументами: false превратился бы в текст «false»
      append(body, [far
        ? h('span', { class: 'legpill warn' }, legText(i) + ' · проверьте город в адресе')
        : [h('span', { class: 'legpill', title: 'На машине' }, ico('car'), legText(i)),
          i.walk && i.walk.s <= 10800 && h('span', { class: 'legpill', title: 'Пешком' }, ico('foot'), walkText(i.walk))],
        dir, dg2 && h('a', { href: dg2, target: '_blank', rel: 'noopener', title: 'Маршрут в 2ГИС' }, '2ГИС'),
        h('span', { class: 'legname' }, 'от «' + a.place + '» · на карте: «' + i.pa.name + '» → «' + i.pb.name + '»' +
          (i.pa.approx || i.pb.approx ? ' · дом на карте не найден, показана улица: расстояние примерное' : ''))]);
    }, () => body.replaceChildren(h('span', { class: 'legpill busy' }, 'не удалось посчитать'),
      h('button', { class: 'lnk', type: 'button', onclick: run }, 'повторить'), dir));
  };
  run();
  return h('li', { class: 'it leg' }, h('div'), h('i', { class: 'ldot' }), body);
}

/* ---- редактор поездки ---- */
function persist() { cur.updated = Date.now(); save(); syncShare(); }

function openTrip(t) {
  cur = t;
  document.title = t.title + ' — поездка';
  setBack(true);

  const fTitle = h('input', { class: 'inp', maxlength: 120, value: t.title });
  const fDest = h('input', { class: 'inp', maxlength: 120, placeholder: 'Город или страна', value: t.dest });
  const fStart = h('input', { class: 'inp', type: 'date', value: t.start });
  const fEnd = h('input', { class: 'inp', type: 'date', value: t.end });
  const fCur = h('select', { class: 'inp' }, CURRENCIES.map(c => h('option', { value: c }, c || 'без валюты')));
  fCur.value = t.currency;
  fTitle.addEventListener('input', () => { t.title = fTitle.value.trim() || 'Поездка'; document.title = t.title + ' — поездка'; persist(); renderHero(els.hero, t, true); });
  fDest.addEventListener('input', () => { t.dest = fDest.value.trim(); persist(); renderHero(els.hero, t, true); });
  fCur.addEventListener('change', () => { t.currency = fCur.value; persist(); refresh(); });
  function dates(which) {
    let s = fStart.value, e = fEnd.value;
    if (!validDate(s) || !validDate(e)) { fStart.value = t.start; fEnd.value = t.end; return; }
    if (e < s) { if (which === 'start') e = s; else s = e; }
    if (diffDays(s, e) >= MAX_DAYS) {
      toast('Поездка не может быть длиннее ' + MAX_DAYS + ' дней', true);
      if (which === 'start') e = addDays(s, MAX_DAYS - 1); else s = addDays(e, -(MAX_DAYS - 1));
    }
    t.start = s; t.end = e; fStart.value = s; fEnd.value = e;
    persist(); refresh();
  }
  fStart.addEventListener('change', () => dates('start'));
  fEnd.addEventListener('change', () => dates('end'));

  els.hero = h('header', { class: 'hero' }); els.budget = h('div', { class: 'l-budget' });
  els.nav = h('div', { class: 'strip' }); els.plan = h('div'); els.people = h('div'); els.fEnd = fEnd;
  const settings = h('details', { class: 'panel settings', open: !t.items.length },
    h('summary', {}, 'Настройки поездки'),
    h('label', { class: 'field' }, h('span', {}, 'Название'), fTitle),
    h('label', { class: 'field' }, h('span', {}, 'Куда'), fDest),
    h('div', { class: 'grid2' },
      h('label', { class: 'field' }, h('span', {}, 'Дата начала'), fStart),
      h('label', { class: 'field' }, h('span', {}, 'Дата конца'), fEnd)),
    h('label', { class: 'field' }, h('span', {}, 'Валюта расходов'), fCur),
    h('button', { class: 'btn tiny danger', onclick: () => {
      if (!confirm('Удалить поездку «' + t.title + '» вместе с планом? Это нельзя отменить.')) return;
      state.trips = state.trips.filter(x => x !== t); save(); location.hash = '';
    } }, 'Удалить поездку'));

  els.settings = settings;
  const settingsOnTop = !t.items.length;        // у новой поездки даты видны сразу
  if (settingsOnTop) settings.setAttribute('style', 'margin-bottom:18px');
  show(
    els.hero,
    settingsOnTop && settings,
    h('div', { class: 'layout' },
      els.budget,
      h('div', { class: 'l-main' }, els.nav, els.plan),
      h('div', { class: 'l-rest' },
        h('section', { class: 'panel' }, h('h2', {}, 'Кто едет'), els.people),
        buildDistPanel(t),
        buildSharePanel(t), !settingsOnTop && settings)));
  renderPeople(); refresh(); syncShare();
}

function renderPeople() {
  const t = cur, box = els.people;
  const nm = h('input', { class: 'inp sm', maxlength: 60, placeholder: 'Имя', 'aria-label': 'Имя попутчика' });
  const em = h('input', { class: 'inp sm', type: 'email', maxlength: 120, placeholder: 'E-mail (необязательно)', 'aria-label': 'E-mail попутчика' });
  box.replaceChildren();
  append(box, [
    t.people.length ? h('div', { class: 'chips' }, t.people.map(p => h('span', { class: 'chip' }, p.name,
      p.email && h('small', {}, p.email),
      h('button', { type: 'button', 'aria-label': 'Убрать ' + p.name, onclick: () => {
        t.people = t.people.filter(x => x !== p); persist(); renderPeople(); refresh();
      } }, '×'))))
      : h('p', { class: 'free', style: 'margin-top:0' }, 'Пока никого. Добавьте тех, кто едет с вами.'),
    h('form', { class: 'row', onsubmit: e => {
      e.preventDefault();
      const name = nm.value.trim(), email = em.value.trim();
      if (!name && !email) { nm.focus(); return; }
      if (email && !emailRe.test(email)) { toast('Похоже, e-mail введён с ошибкой', true); em.focus(); return; }
      if (t.people.length >= MAX_PEOPLE) { toast('Слишком много участников', true); return; }
      if (email && t.people.some(p => p.email.toLowerCase() === email.toLowerCase())) { toast('Этот e-mail уже добавлен', true); return; }
      t.people.push({ name: name || email.split('@')[0], email });
      persist(); renderPeople(); refresh();
    } }, nm, em, h('button', { class: 'btn', type: 'submit' }, 'Добавить')),
    h('p', { class: 'muted' }, 'E-mail нужен только для приглашений в Google Календарь. В ссылку для попутчиков он не попадает.')
  ]);
}

/* ---- расстояние между двумя местами ---- */
function buildDistPanel(t) {
  const list = h('datalist', { id: 'places-list' });
  const fillList = () => { list.replaceChildren(); placesOf(t).forEach(p => list.append(h('option', { value: p }))); };
  fillList();
  const mk = (ph, label) => h('input', { class: 'inp sm', maxlength: 160, list: 'places-list', autocomplete: 'off', placeholder: ph, 'aria-label': label });
  const fA = mk('Например: Алматы', 'Откуда'), fB = mk('Например: Бишкек', 'Куда');
  const counts = {};
  cityContext(t).forEach(v => { if (v) counts[v] = (counts[v] || 0) + 1; });
  const fC = h('input', { class: 'inp sm', maxlength: 60, autocomplete: 'off', placeholder: 'Например: Астана', 'aria-label': 'Город для поиска мест',
    value: Object.keys(counts).sort((x, y) => counts[y] - counts[x])[0] || '' });
  fA.addEventListener('focus', fillList); fB.addEventListener('focus', fillList);
  const out = h('div', { class: 'dres', 'aria-live': 'polite' });
  const say = (...kids) => out.replaceChildren(...kids);
  async function go() {
    const a = fA.value.trim(), b = fB.value.trim();
    if (!a || !b) { say(h('p', { class: 'muted' }, 'Укажите оба места.')); return; }
    if (a.toLowerCase() === b.toLowerCase()) { say(h('p', { class: 'muted' }, 'Это одно и то же место.')); return; }
    say(h('p', { class: 'muted' }, 'Считаем…'));
    const city = fC.value.trim(), qa = withCity(a, city), qb = withCity(b, city);
    let i;
    try { i = await legInfo(qa, qb); }
    catch (e) { say(h('p', { class: 'muted' }, 'Не удалось связаться с картой. Проверьте интернет и попробуйте ещё раз.')); return; }
    if (i.missing) { say(h('p', { class: 'muted' }, 'Не нашли на карте: «' + i.missing + '». Уточните название, например добавьте город.')); return; }
    say(h('div', { class: 'dr' },
      h('b', {}, a + ' → ' + b),
      i.road ? h('div', {}, 'На машине: ' + fmtKm(i.m) + ' · ' + fmtDur(i.s))
        : h('div', {}, 'Маршрут по дорогам не построился. По прямой: ' + fmtKm(i.line)),
      i.walk && h('div', {}, 'Пешком: ' + walkText(i.walk)),
      i.road && h('div', { class: 'muted', style: 'margin:2px 0 0' }, 'По прямой: ' + fmtKm(i.line)),
      h('div', { class: 'muted', style: 'margin:2px 0 8px' }, 'На карте найдено: «' + i.pa.name + '» → «' + i.pb.name + '»' +
        (i.pa.approx || i.pb.approx ? '. Дом на карте не найден, показана улица, поэтому расстояние примерное.' : '')),
      h('a', { href: dirUrl(qa, qb), target: '_blank', rel: 'noopener' }, 'Открыть маршрут в Google Maps'),
      dgisRoute(dgisSame(a, city, b, city), i.pa, i.pb) && [' · ', h('a', { href: dgisRoute(dgisSame(a, city, b, city), i.pa, i.pb), target: '_blank', rel: 'noopener' }, 'в 2ГИС')]));
  }
  return h('section', { class: 'panel' }, h('h2', {}, 'Расстояние между местами'), list,
    h('form', { onsubmit: e => { e.preventDefault(); go(); } },
      h('label', { class: 'field' }, h('span', {}, 'Откуда'), fA),
      h('label', { class: 'field' }, h('span', {}, 'Куда'), fB),
      h('label', { class: 'field' }, h('span', {}, 'Город для поиска мест'), fC),
      h('button', { class: 'btn primary', type: 'submit' }, 'Посчитать')),
    out,
    h('p', { class: 'muted' }, 'Расстояние считают открытые сервисы (OpenStreetMap, Open-Meteo и OSRM), им отправляются названия мест. Город подставляется к местам, у которых его нет, чтобы карта не находила одноимённые места в другом городе. Если нашлось не то место, уточните название: добавьте улицу. Время приблизительное: на машине без пробок, остановок и очереди на границе, пешком из расчёта около 5 км/ч. Такие же расстояния показаны между соседними местами плана и между городами в шапке.'));
}

      } }, 'Поделиться…'),

}
async function copyLink() {
  if (!shareLink) return;
  try { await navigator.clipboard.writeText(shareLink); toast('Ссылка скопирована'); }
  catch (e) {
    els.link.select();
    try { document.execCommand('copy'); toast('Ссылка скопирована'); }
    catch (_) { toast('Выделите ссылку и скопируйте вручную', true); }
  }
}
function syncShare() {
  const t = cur;
  if (!t || !els.gcal) return;
  const guests = guestsOf(t);
  els.gcal.href = tripGcal(t, guests);
  els.gcal.textContent = guests.length ? 'Пригласить участников в Google Календарь' : 'Добавить в Google Календарь';
  els.gnote.textContent = guests.length
    ? 'Откроется Google Календарь с поездкой и уже добавленными гостями — нажмите «Сохранить» и подтвердите отправку приглашений. Каждый пункт плана можно так же добавить кнопкой «В календарь». Файл .ics открывается в любом календаре (Google, Apple, Outlook).'
    : 'Добавьте e-mail участников выше — тогда поездку можно отправить им приглашением в Google Календарь. Файл .ics открывается в любом календаре (Google, Apple, Outlook).';
  const my = ++shareTok;
  pack(packTrip(t)).then(p => {
    if (my !== shareTok || cur !== t) return;
    shareLink = baseUrl() + '#s=' + p;
    els.link.value = shareLink;
    const msg = 'План поездки «' + t.title + '»';
    els.tg.href = 'https://t.me/share/url?url=' + encodeURIComponent(shareLink) + '&text=' + encodeURIComponent(msg);
    els.wa.href = 'https://wa.me/?text=' + encodeURIComponent(msg + ' ' + shareLink);
    els.mail.href = 'mailto:' + guests.join(',') + '?subject=' + encodeURIComponent(msg) +
      '&body=' + encodeURIComponent(msg + ':\n' + shareLink);
    els.len.classList.toggle('hide', shareLink.length < 3500);
    els.len.textContent = 'Ссылка получилась длинной (' + shareLink.length + ' символов): в некоторых мессенджерах она может обрезаться. Сократите заметки или отправьте план файлом .ics.';
  }).catch(() => {});
}

/* ---- просмотр чужого плана ---- */
async function openShared(payload, my) {
  setBack(true);
  document.title = 'План поездки';
  show(h('p', { class: 'lead' }, 'Загружаем план…'));
  let t = null, reason = '';
  try { t = unpackTrip(await unpack(payload)); }
  catch (e) {
    if (payload[0] === 'z' && typeof DecompressionStream !== 'function') reason = 'Этот браузер слишком старый, чтобы открыть план. Обновите его или откройте ссылку в другом.';
  }
  if (my !== routeTok) return;
  if (!t) {
    show(h('div', { class: 'panel' }, h('h2', {}, 'Не удалось открыть план'),
      h('p', { class: 'lead' }, reason || 'Ссылка повреждена или скопирована не полностью. Попросите отправить её ещё раз.')));
    return;
  }
  document.title = t.title + ' — план поездки';
  const hero = h('header', { class: 'hero' }), budget = h('div', { class: 'l-budget' }), nav = h('div', { class: 'strip' }), plan = h('div');
  show(
    hero,
    h('div', { class: 'panel banner' },
      h('b', {}, 'Вам прислали план поездки'),
      h('div', { class: 'row' },
        h('button', { class: 'btn primary', onclick: () => importTrip(t) }, 'Сохранить себе'),
        h('a', { class: 'btn', target: '_blank', rel: 'noopener', href: tripGcal(t, []) }, 'В Google Календарь'),
        h('button', { class: 'btn', onclick: () => downloadICS(t) }, 'Скачать .ics'))),
    h('div', { class: 'layout' }, budget, h('div', { class: 'l-main' }, nav, plan)));
  renderHero(hero, t); renderBudget(budget, t); renderNav(nav, t); renderDays(plan, t, false); watchDays();
}
function importTrip(t) {
  const i = state.trips.findIndex(x => x.id === t.id);
  if (i >= 0) {
    if (!confirm('Эта поездка уже есть у вас. Заменить вашу копию обновлённым планом? Ваши правки в ней пропадут.')) return;
    t.people = state.trips[i].people.length ? state.trips[i].people : t.people;   // свои приглашённые не теряем
    state.trips[i] = t;
  } else state.trips.push(t);
  save();
  location.hash = '#trip=' + encodeURIComponent(t.id);
}

/* ================= тема и запуск ================= */
function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  $('#theme').textContent = theme === 'light' ? 'Тёмная тема' : 'Светлая тема';
  document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#eef3fb' : '#0b1020';
  try { localStorage.setItem('habitTheme', theme); } catch (e) {}
}
$('#theme').addEventListener('click', () => applyTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'));
{
  const t = document.documentElement.dataset.theme;

  document.querySelector('meta[name="theme-color"]').content = t === 'light' ? '#eef3fb' : '#0b1020';
}
