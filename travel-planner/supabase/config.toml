# Settings for the Supabase CLI (`npx supabase start` for a local stack, `npx supabase db push`
# to apply migrations to a linked project). Hosted projects are configured in the dashboard;
# this file only drives local development. Nothing here is a secret.

project_id = "wanderplan"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Local development catches mail in Inbucket (http://localhost:54324); set true in production
# if you want people to verify their address before signing in.
enable_confirmations = false

# Uncomment and set the environment variables to try Google sign-in locally.
# [auth.external.google]
# enabled = true
# client_id = "env(GOOGLE_CLIENT_ID)"
# secret = "env(GOOGLE_CLIENT_SECRET)"
